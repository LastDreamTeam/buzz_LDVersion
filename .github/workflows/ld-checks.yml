name: LD overlay upgrade guard
on:
  push:
    branches: [main_1]
    paths: ['desktop/**', 'ld/**', '.github/workflows/ld-*.yml', 'pnpm-lock.yaml']
  pull_request:
    branches: [main_1]
    paths: ['desktop/**', 'ld/**', '.github/workflows/ld-*.yml', 'pnpm-lock.yaml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ld-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  display-boundary:
    if: github.repository == 'LastDreamTeam/buzz_LDVersion'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.14.1
          package-manager-cache: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 11.4.0
      - run: pnpm install --frozen-lockfile --filter buzz... --ignore-scripts
      - run: node --test desktop/ld/localize.test.mjs desktop/ld/reference-catalog.test.mjs
      - run: pnpm --dir desktop exec tsc --noEmit -p ld/tsconfig.json
      - run: node desktop/ld/inventory.mjs --summary
