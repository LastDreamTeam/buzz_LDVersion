name: LD CLI compatibility
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux-cli:
    if: github.repository == 'LastDreamTeam/buzz_LDVersion' && github.ref == 'refs/heads/main_1'
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      - name: Build the pinned native CLI
        run: cargo build --locked --release -p buzz-cli
      - name: CLI unit tests and black-box edit regression
        run: |
          cargo test --locked -p buzz-cli
          python3 ld/tests/cli-edit-stdin.py target/release/buzz
          cargo fmt --all -- --check
      - name: Package with integrity receipt
        run: |
          mkdir -p ld-artifact
          cp target/release/buzz ld-artifact/
          printf '%s\n' "$GITHUB_SHA" > ld-artifact/SOURCE_COMMIT
          cd ld-artifact
          sha256sum buzz SOURCE_COMMIT > SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ld-buzz-cli-linux-x64
          path: ld-artifact/
          retention-days: 30
          if-no-files-found: error
